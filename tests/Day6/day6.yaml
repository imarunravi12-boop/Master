
Playwright Locators:
- get_by_role - text ,button, link, checkbox, radio, etc.
- get_by_placeholder - for input placeholders
- get_by_label - for form labels
- get_by_text - for exact text match
- get_by_title - for title attribute
- get_by_alt_text - for images
- get_by_test_id
- get_by_class


Playwright Assertions:
Assertion is a checkpoint in the test to verify that the UI or application behavior is correct.

Types:
1. Auto-retry
2. Non-retry
3. soft
4. hard

Assertion Types:
Genernic type
locators type
page type
Api Assertion type
Negating Assertions



