2. Allure Report (Test Reporting Tool) :

What it is:
A beautiful reporting tool used to display Playwright test results in a clean and interactive dashboard.

Why it's useful:

Shows passed/failed tests

Shows screenshots, steps, logs

Helps understand why a test failed

Easy to share with team

How it works with Playwright follow below steps:

Commands for Allure Reports:
---------------------------
In the configuration make below changes:
reporter: [['html'], ['allure-playwright']],

And execute below commands in the terminal :

1. npm i -D allure-playwright

2. npm i -g allure-commandline --save-dev

3. Execute the file for which the report has to be generated using the command : 
npx playwright test filename.spec.ts

4. Use command : " allure serve " to generate the allure report.

