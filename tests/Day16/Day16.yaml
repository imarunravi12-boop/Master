1. Codegen (Playwright Code Generator),

What it is:
A tool in Playwright that automatically generates test scripts based on my actions on the browser.

Why it's useful:
I don't need to write code manually. Just click, type, or navigate — Playwright writes the code for you.

How it works:

Run: npx playwright codegen

A browser opens.

Whatever actions you perform, Playwright converts them into code in JavaScript/TypeScript/Python.

Simple example:
You click a login button → Playwright generates:

await page.click('#login');

---------------------------------------------------

Start Codegen from VS Code (Easiest Way)

Method A: Using Command Palette
--------------------------------

Press Ctrl + Shift + P

Type: Playwright: Record New Test

Select it → Codegen window opens

Method B: Right-click testing icon in VS code
----------------------------------------------

1. Click the testing icon in the right panel.

2. Choose: "Record New"

3. VS Code opens a browser + side panel

It starts generating code automatically

