// Array methods
1.push - Adds a new item to the end of the array
2.pop - Removes the last item from the array
3.shift - Removes the first item from the array
4.unshift - Adds a new item to the beginning of the array
5.slice - Returns a portion of the array
6.splice - Adds or removes items from the array


Alerts in TypeScript
1.alert() - Displays an alert box with a specified message and an OK button.
2.confirm() - Displays a dialog box with a specified message, along with OK and Cancel buttons.
3.prompt() - Displays a dialog box that prompts the user for input.
4.console.log() - Outputs a message to the web console.

