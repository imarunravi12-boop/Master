Action Allowed in Playwright Alerts Handling
dialog.accept() - Accepts the alert dialog.
dialog.dismiss() - Dismisses the alert dialog.
dialog.message() - Retrieves the message displayed in the alert dialog.
dialog.accept('text') - Accepts the prompt dialog with the specified text input.
dialog.type() - Retrieves the type of the alert dialog (e.g., alert, confirm, prompt)



