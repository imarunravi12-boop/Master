Test Annotations : Configure behavior of tests and test suites
test.only -> Run only this test
test.skip -> Skip this test 
test.fail -> Mark test as expected to fail
test.fixme -> Mark test as needing a fix
test.use -> overide context
test.info -> it shows additional information about the test
test.describe -> Group tests together
test.describe.parallel -> Run tests in the suite in parallel
test.describe.serial -> Run tests in the suite serially
test.beforeEach -> Run before each test in the suite
test.afterEach -> Run after each test in the suite


